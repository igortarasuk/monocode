name: Release

# Monochrome's Linux release: push `v<package.json version>` to build the
# .deb, .AppImage and .rpm and publish them as a GitHub Release. Needs no
# secrets beyond the built-in GITHUB_TOKEN. Packages are unsigned and the
# app has no auto-update feed. SSH hosts come from host-release.yml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    name: deb and AppImage
    runs-on: ubuntu-24.04
    # Build inside Ubuntu 22.04 so the packages need only glibc 2.35 and run on
    # older distributions; the ubuntu-22.04 runner image itself is retired.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      # No FUSE in containers; linuxdeploy's AppImage must unpack itself.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install git, certificates and xdg-utils
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates xdg-utils

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches app version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match v$VERSION" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  linux-rpm:
    name: rpm
    runs-on: ubuntu-latest
    # Build on EL 10 so the rpm's glibc requirement matches the oldest
    # supported target; a newer distro's rpm installs there but fails to load.
    container: almalinux:10
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      - name: Build rpm package
        run: npm run build:fedora

      - name: Install and stage the rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          dnf install -y "${bundle[0]}"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, linux-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/*.deb dist/*.AppImage dist/*.rpm)
          if (( ${#FILES[@]} != 3 )); then
            echo "Expected a .deb, an AppImage and an .rpm" >&2
            exit 1
          fi
          (cd dist && sha256sum *.deb *.AppImage *.rpm > SHA256SUMS)
          FILES+=(dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Monochrome ${GITHUB_REF_NAME#v}" \
              --notes "Linux packages for Monochrome ${GITHUB_REF_NAME#v}. SSH host packages are in host-v${GITHUB_REF_NAME#v}."
          fi
